name: Temporary JSON schema validator lock update

on:
  push:
    branches:
      - feat/accessibility-settings-ai-rework-20261017
    paths:
      - .github/workflows/temporary-schema-validator-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install the application JSON Schema validator
        run: npm install --save-exact json-schema-library@11.6.2 --no-audit --no-fund
      - name: Commit generated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add JSON Schema validation library"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Dependency and lockfile are already synchronized."
          fi
