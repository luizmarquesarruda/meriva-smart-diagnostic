name: Generate package lock

on:
  push:
    branches:
      - fix/bluetooth-audit-20261007

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/bluetooth-audit-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git commit -m "chore: generate package lock"
          git push origin HEAD:fix/bluetooth-audit-20261007
