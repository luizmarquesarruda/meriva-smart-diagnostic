name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  # Push and PR events for the same branch must cancel/replace each other, avoiding duplicate APK builds.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'
      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          test -n "$JAVA_HOME"
      - run: npm ci --no-audit --no-fund
      - run: npm run doctor
      - name: Run anti-regression baseline gate
        run: npm run gate:baseline
      - run: npm run validate

  android-build:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Assemble Android release APK (standalone)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2
      - name: Verify standalone APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload Android standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: meriva-smart-diagnostic-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish latest Android APK
    # Publish only from main, and only after validation + native APK build succeeded.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [validate, android-build]
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v7
        with:
          name: meriva-smart-diagnostic-standalone-apk
          path: dist
      - name: Publish GitHub Release and stable APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          APK="dist/app-release.apk"
          test -s "$APK"
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK#meriva-smart-diagnostic.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Meriva Smart build ${GITHUB_RUN_NUMBER}" \
            --notes "APK standalone gerado pela CI após validate e android-build aprovados. Commit: ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" \
            --latest
