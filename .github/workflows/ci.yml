name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
    # Keep code changes automatically validated; skip documentation-only pushes.
    # A push containing both code and documentation still runs the full CI.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'
      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          test -n "$JAVA_HOME"
      - run: npm ci --no-audit --no-fund
      - run: npm run doctor
      - run: npm run validate

  auto-repair:
    # Apply only narrowly-scoped deterministic repairs after a failed CI on a
    # working branch. Unknown failures are reported in the job log, not guessed at.
    if: ${{ always() && github.event_name == 'push' && github.ref != 'refs/heads/main' && (needs.validate.result == 'failure' || needs.android-build.result == 'failure') }}
    needs: [validate, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply known safe repairs
        run: python .github/scripts/repair_known_ci.py
      - name: Commit and push if a safe repair was applied
        run: |
          if git diff --quiet; then
            echo "No known safe repair matched. Manual diagnosis is still required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/saude.tsx src/obd/exportBluetoothDiagnosticTxt.ts
          git commit -m "ci: apply deterministic repair after failed validation"
          git push origin "HEAD:${{ github.ref_name }}"

  android-build:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Assemble Android release APK (standalone)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2
      - name: Verify standalone APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload Android standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: meriva-smart-diagnostic-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
