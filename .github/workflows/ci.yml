name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'
      - name: Verify Java toolchain
        run: |
          java -version
          javac -version
          test -n "$JAVA_HOME"
      - run: npm ci --no-audit --no-fund
      - run: npm run doctor
      - name: Run anti-regression baseline gate
        run: npm run gate:baseline
      - run: npm run validate

  android-build:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Assemble Android release APK (standalone)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2
      - name: Verify standalone APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload Android standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: meriva-smart-diagnostic-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14


  publish-ota:
    name: Publish OTA update
    runs-on: ubuntu-24.04
    needs: [validate, android-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EAS_UPDATE_ENABLED == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Detect whether this commit is safe for OTA
        id: ota-gate
        env:
          BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "app_code_changed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping OTA because the previous commit cannot be determined."
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          if printf '%s\n' "$changed" | grep -Eq '^(app\.json|package\.json|package-lock\.json|eas\.json|tsconfig\.json|babel\.config\.js|metro\.config\.js|plugins/|android/|ios/|patches/|.*\.(gradle|gradle\.kts|kt|java|podspec|swift)$)'; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/|src/|assets/|components/|hooks/)'; then
            echo "app_code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_code_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Expo token
        if: steps.ota-gate.outputs.app_code_changed == 'true' && steps.ota-gate.outputs.native_changed != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure o segredo EXPO_TOKEN nas configurações do GitHub."
            exit 1
          fi
      - name: Publish compatible Android update to production
        if: steps.ota-gate.outputs.app_code_changed == 'true' && steps.ota-gate.outputs.native_changed != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@latest update --channel production --platform android --message "Meriva Smart OTA ${GITHUB_SHA}" --non-interactive
      - name: Explain native-change gate
        if: steps.ota-gate.outputs.native_changed == 'true'
        run: |
          echo "OTA não publicado: mudança nativa/configuração exige APK novo e runtime compatível."
      - name: Explain no app-code changes
        if: steps.ota-gate.outputs.app_code_changed == 'false' && steps.ota-gate.outputs.native_changed != 'true'
        run: |
          echo "OTA ignorado: este commit não alterou código ou assets do aplicativo."
