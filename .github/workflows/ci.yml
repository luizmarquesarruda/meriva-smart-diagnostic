name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run doctor
      - run: npm run validate

  android-build:
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 30
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Assemble Android release APK (standalone, no Metro)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify standalone APK and embedded JS bundle
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          sha256sum "$APK"
          echo "Standalone APK OK: $APK"
          echo "Embedded JS bundle OK: assets/index.android.bundle"
      - name: Upload Android standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: meriva-smart-diagnostic-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
