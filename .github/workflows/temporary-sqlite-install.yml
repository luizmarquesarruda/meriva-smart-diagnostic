name: Temporary SQLite dependency installation

on:
  workflow_dispatch:
  push:
    branches: ['feat/accessibility-settings-ai-rework-20261017']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/accessibility-settings-ai-rework-20261017
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --save-exact expo-sqlite@~14.0.6 --no-audit --no-fund
      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "build(android): add Expo SQLite for persistent local history"
          git push origin HEAD:feat/accessibility-settings-ai-rework-20261017
