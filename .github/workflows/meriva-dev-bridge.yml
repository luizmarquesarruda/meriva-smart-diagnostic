name: Meriva Dev Bridge CI

on:
  pull_request:
    paths:
      - "tools/meriva-dev-bridge/**"
      - ".github/workflows/meriva-dev-bridge.yml"
  push:
    branches:
      - main
    paths:
      - "tools/meriva-dev-bridge/**"
      - ".github/workflows/meriva-dev-bridge.yml"

permissions:
  contents: read

jobs:
  build-bridge:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tools/meriva-dev-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: tools/meriva-dev-bridge/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript build
        run: npm run build
